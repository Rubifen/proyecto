        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Configuración del canvas
        const GAME_WIDTH = 800;
        const GAME_HEIGHT = 600;
        canvas.width = GAME_WIDTH;
        canvas.height = GAME_HEIGHT;

        // Estados del juego
        const GAME_STATE = {
            START: 0,
            RUNNING: 1,
            GAME_OVER: 2,
            WIN: 3,
            LEVEL_COMPLETE: 4
        };
        let currentGameState = GAME_STATE.START;
        let currentLevel = 1;
        const MAX_LEVELS = 5;

        const keys = {
            right: false,
            left: false,
            up: false
        };

        // Jugador
        const player = {
            width: 32,
            height: 48,
            x: 100,
            y: GAME_HEIGHT - 100,
            speed: 5,
            velocityX: 0,
            velocityY: 0,
            jumpPower: 18,
            isJumping: false,
            onGround: false,
            lives: 3
        };

        const gravity = 0.8;

        let platforms = [];
        let coins = [];
        let enemies = [];

        let camera = {
            x: 0,
            y: 0

        const levelColors = [
            '#5c94fc', // Nivel 1 - Cielo azul
            '#ff9966', // Nivel 2 - Atardecer
            '#2c3e50', // Nivel 3 - Noche
            '#8e44ad', // Nivel 4 - Místico
            '#c0392b'  // Nivel 5 - Volcánico
        ];

        // Partículas para efectos
        let particles = [];

        function createParticle(x, y, color) {
            for (let i = 0; i < 8; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 0.5) * 6,
                    life: 30,
                    color: color,
                    size: Math.random() * 4 + 2
                });
            }
        }

        function updateParticles() {
            particles = particles.filter(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.1;
                p.life--;
                return p.life > 0;
            });
        }

        function drawParticles() {
            particles.forEach(p => {
                ctx.globalAlpha = p.life / 30;
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x - camera.x, p.y - camera.y, p.size, p.size);
            });
            ctx.globalAlpha = 1;
        }

        // --- FUNCIONES DE DIBUJO ---
        function drawPlayer() {
            ctx.save();
            ctx.translate(player.x - camera.x, player.y - camera.y);
            
            // Cuerpo
            ctx.fillStyle = '#e74c3c';
            ctx.fillRect(0, 16, player.width, player.height - 16);
            
            // Overol
            ctx.fillStyle = '#3498db';
            ctx.fillRect(4, 32, player.width - 8, 16);
            ctx.fillRect(0, 32, 8, 8);
            ctx.fillRect(player.width - 8, 32, 8, 8);

            // Cabeza
            ctx.fillStyle = '#f1c40f';
            ctx.fillRect(4, 0, player.width - 8, 16);

            // Gorra
            ctx.fillStyle = '#e74c3c';
            ctx.fillRect(0, 0, player.width, 8);

            // Ojos
            ctx.fillStyle = 'white';
            ctx.fillRect(8, 4, 6, 6);
            ctx.fillRect(18, 4, 6, 6);
            ctx.fillStyle = 'black';
            ctx.fillRect(10, 6, 3, 3);
            ctx.fillRect(20, 6, 3, 3);
            
            ctx.restore();
        }

        function drawPlatforms() {
            platforms.forEach(p => {
                const screenX = p.x - camera.x;
                const screenY = p.y - camera.y;

                if (screenX + p.width < 0 || screenX > GAME_WIDTH || screenY + p.height < 0 || screenY > GAME_HEIGHT) {
                    return;
                }

                // Parte superior (césped)
                ctx.fillStyle = '#27ae60';
                ctx.fillRect(screenX, screenY, p.width, 10);
                
                // Parte inferior (tierra)
                ctx.fillStyle = '#8c5a2b';
                ctx.fillRect(screenX, screenY + 10, p.width, p.height - 10);

                // Sombreado simple
                ctx.fillStyle = 'rgba(0,0,0,0.2)';
                ctx.fillRect(screenX, screenY + p.height - 5, p.width, 5);
            });
        }

        function drawMovingPlatforms() {
            movingPlatforms.forEach(p => {
                const screenX = p.x - camera.x;
                const screenY = p.y - camera.y;

                // Plataforma con efecto brillante
                const gradient = ctx.createLinearGradient(screenX, screenY, screenX, screenY + p.height);
                gradient.addColorStop(0, '#9b59b6');
                gradient.addColorStop(1, '#8e44ad');
                ctx.fillStyle = gradient;
                ctx.fillRect(screenX, screenY, p.width, p.height);

                // Borde brillante
                ctx.strokeStyle = '#e74c3c';
                ctx.lineWidth = 2;
                ctx.strokeRect(screenX, screenY, p.width, p.height);
            });
        }

        function drawSpikes() {
            spikes.forEach(s => {
                const screenX = s.x - camera.x;
                const screenY = s.y - camera.y;

                ctx.fillStyle = '#7f8c8d';
                for (let i = 0; i < s.width / 16; i++) {
                    ctx.beginPath();
                    ctx.moveTo(screenX + i * 16, screenY + s.height);
                    ctx.lineTo(screenX + i * 16 + 8, screenY);
                    ctx.lineTo(screenX + i * 16 + 16, screenY + s.height);
                    ctx.closePath();
                    ctx.fill();
                }
            });
        }
        
        function drawCoins() {
            coins.forEach(c => {
                if (!c.active) return;
                const screenX = c.x - camera.x;
                const screenY = c.y - camera.y;

                // Animación de flotación
                const floatY = Math.sin(Date.now() / 200 + c.x) * 3;

                ctx.beginPath();
                ctx.arc(screenX, screenY + floatY, c.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#f1c40f';
                ctx.fill();
                ctx.strokeStyle = '#f39c12';
                ctx.lineWidth = 2;
                ctx.stroke();

                // Brillo
                ctx.beginPath();
                ctx.arc(screenX - 3, screenY + floatY - 3, 3, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255,255,255,0.6)';
                ctx.fill();
            });
        }
        
        function drawEnemies() {
            enemies.forEach(e => {
                const screenX = e.x - camera.x;
                const screenY = e.y - camera.y;
                
                // Cuerpo con color según tipo
                ctx.fillStyle = e.fast ? '#e74c3c' : '#795548';
                ctx.beginPath();
                ctx.moveTo(screenX, screenY + e.height);
                ctx.bezierCurveTo(screenX, screenY, screenX + e.width, screenY, screenX + e.width, screenY + e.height);
                ctx.closePath();
                ctx.fill();

                // Pies
                ctx.fillStyle = e.fast ? '#c0392b' : '#5D4037';
                ctx.fillRect(screenX, screenY + e.height - 5, 8, 5);
                ctx.fillRect(screenX + e.width - 8, screenY + e.height - 5, 8, 5);

                // Ojos (más enojados si son rápidos)
                ctx.fillStyle = 'white';
                ctx.fillRect(screenX + 6, screenY + 10, 8, 8);
                ctx.fillRect(screenX + e.width - 14, screenY + 10, 8, 8);
                ctx.fillStyle = e.fast ? '#e74c3c' : 'black';
                ctx.fillRect(screenX + 9, screenY + 13, 3, 3);
                ctx.fillRect(screenX + e.width - 11, screenY + 13, 3, 3);

                // Cejas enojadas para enemigos rápidos
                if (e.fast) {
                    ctx.strokeStyle = 'black';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(screenX + 4, screenY + 8);
                    ctx.lineTo(screenX + 16, screenY + 12);
                    ctx.moveTo(screenX + e.width - 4, screenY + 8);
                    ctx.lineTo(screenX + e.width - 16, screenY + 12);
                    ctx.stroke();
                }
            });
        }

        function drawGoal() {
            const screenX = goal.x - camera.x;
            const screenY = goal.y - camera.y;
            
            ctx.save();
            ctx.translate(screenX, screenY);
            let rot = (Date.now() / 1000) * 2;
            ctx.rotate(rot);

            // Estrella más grande y brillante para niveles avanzados
            const sizeMult = 1 + (currentLevel - 1) * 0.1;
            ctx.fillStyle = '#f1c40f';
            ctx.strokeStyle = '#f39c12';
            ctx.lineWidth = 4;
            ctx.beginPath();
            let points = 5;
            let outerRadius = 30 * sizeMult;
            let innerRadius = 15 * sizeMult;

            for (let i = 0; i < points * 2; i++) {
                let radius = i % 2 === 0 ? outerRadius : innerRadius;
                let angle = (i * Math.PI) / points - Math.PI / 2;
                ctx.lineTo(Math.cos(angle) * radius, Math.sin(angle) * radius);
            }
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // Efecto de brillo
            ctx.shadowColor = '#f1c40f';
            ctx.shadowBlur = 20;
            ctx.fill();

            ctx.restore();
        }
