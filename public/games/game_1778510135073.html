<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dungeon Crawler</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            color: #fafafa;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: 'Consolas', 'Courier New', monospace;
        }
        canvas {
            background-color: #000;
            border: 2px solid #666;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <script>
        window.onload = function () {
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');

            // --- CONSTANTES Y CONFIGURACIÓN ---
            const TILE_SIZE = 22;
            const MAP_COLS = 45;
            const MAP_ROWS = 30;

            canvas.width = MAP_COLS * TILE_SIZE;
            canvas.height = MAP_ROWS * TILE_SIZE;

            const FONT_SIZE = 20;
            ctx.font = `${FONT_SIZE}px 'Consolas', 'Courier New', monospace`;

            const COLORS = {
                WALL: '#4a4a4a',
                FLOOR: '#1e1e1e',
                PLAYER: '#3498db',
                MONSTER: '#e74c3c',
                STAIRS: '#f1c40f',
                TREASURE: '#2ecc71',
                TEXT: '#ecf0f1',
                HP_BAR: '#c0392b',
                HP_BAR_BACK: '#592323'
            };

            const TILE_TYPES = {
                WALL: 0,
                FLOOR: 1
            };

            // --- ESTADO DEL JUEGO ---
            let gameState = 'START'; // START, PLAYING, GAME_OVER
            let map, player, monsters, stairs, treasures;
            let floor = 1;
            let messages = [];

            // --- CLASES DE ENTIDADES ---
            class Entity {
                constructor(x, y, char, color, name, hp, attack) {
                    this.x = x;
                    this.y = y;
                    this.char = char;
                    this.color = color;
                    this.name = name;
                    this.maxHp = hp;
                    this.hp = hp;
                    this.attack = attack;
                }

                draw() {
                    ctx.fillStyle = this.color;
                    ctx.fillText(this.char, this.x * TILE_SIZE + TILE_SIZE / 2, this.y * TILE_SIZE + TILE_SIZE / 2);
                }
            }
            
            class Player extends Entity {
                constructor(x, y) {
                    super(x, y, '@', COLORS.PLAYER, 'Player', 30, 5);
                    this.score = 0;
                }
            }

            class Monster extends Entity {
                constructor(x, y, type) {
                    if (type === 'goblin') {
                        super(x, y, 'g', COLORS.MONSTER, 'Goblin', 10, 2);
                    } else { // orc
                        super(x, y, 'o', '#e67e22', 'Orc', 18, 4);
                    }
                }
            }

            // --- GENERACIÓN DE MAPA ---
            function createDungeon() {
                map = Array.from({ length: MAP_ROWS }, () => Array(MAP_COLS).fill(TILE_TYPES.WALL));
                monsters = [];
                treasures = [];
                const rooms = [];

                const maxRooms = 15, minRoomSize = 4, maxRoomSize = 8;

                for (let i = 0; i < maxRooms; i++) {
                    const w = Math.floor(Math.random() * (maxRoomSize - minRoomSize + 1)) + minRoomSize;
                    const h = Math.floor(Math.random() * (maxRoomSize - minRoomSize + 1)) + minRoomSize;
                    const x = Math.floor(Math.random() * (MAP_COLS - w - 1)) + 1;
                    const y = Math.floor(Math.random() * (MAP_ROWS - h - 1)) + 1;

                    const newRoom = { x, y, w, h };
                    let failed = false;
                    for (const otherRoom of rooms) {
                        if (newRoom.x < otherRoom.x + otherRoom.w &&
                            newRoom.x + newRoom.w > otherRoom.x &&
                            newRoom.y < otherRoom.y + otherRoom.h &&
                            newRoom.h + newRoom.y > otherRoom.y) {
                            failed = true;
                            break;
                        }
                    }

                    if (!failed) {
                        createRoom(newRoom);
                        const [centerX, centerY] = [Math.floor(newRoom.x + newRoom.w / 2), Math.floor(newRoom.y + newRoom.h / 2)];

                        if (rooms.length === 0) {
                            player.x = centerX;
                            player.y = centerY;
                        } else {
                            const [prevCenterX, prevCenterY] = [Math.floor(rooms[rooms.length - 1].x + rooms[rooms.length - 1].w / 2), Math.floor(rooms[rooms.length - 1].y + rooms[rooms.length - 1].h / 2)];
                            if (Math.random() > 0.5) {
                                createHTunnel(prevCenterX, centerX, prevCenterY);
                                createVTunnel(prevCenterY, centerY, centerX);
                            } else {
                                createVTunnel(prevCenterY, centerY, prevCenterX);
                                createHTunnel(prevCenterX, centerX, centerY);
                            }
                        }
                        populateRoom(newRoom);
                        rooms.push(newRoom);
                    }
                }
                
                const lastRoom = rooms[rooms.length - 1];
                stairs = { x: Math.floor(lastRoom.x + lastRoom.w / 2), y: Math.floor(lastRoom.y + lastRoom.h / 2) };
            }

            function createRoom(room) {
                for (let y = room.y; y < room.y + room.h; y++) {
                    for (let x = room.x; x < room.x + room.w; x++) {
                        map[y][x] = TILE_TYPES.FLOOR;
                    }
                }
            }
            
            function createHTunnel(x1, x2, y) {
                for (let x = Math.min(x1, x2); x <= Math.max(x1, x2); x++) {
                    map[y][x] = TILE_TYPES.FLOOR;
                }
            }

            function createVTunnel(y1, y2, x) {
                for (let y = Math.min(y1, y2); y <= Math.max(y1, y2); y++) {
                    map[y][x] = TILE_TYPES.FLOOR;
                }
            }
            
            function populateRoom(room) {
                const numMonsters = Math.floor(Math.random() * (floor / 2 + 2));
                 for (let i = 0; i < numMonsters; i++) {
                    const x = Math.floor(Math.random() * (room.w-2)) + room.x + 1;
                    const y = Math.floor(Math.random() * (room.h-2)) + room.y + 1;
                    if (!isBlocked(x,y)) {
                        const type = Math.random() < 0.7 ? 'goblin' : 'orc';
                        monsters.push(new Monster(x, y, type));
                    }
                }
                const numTreasures = Math.floor(Math.random() * 3);
                 for (let i = 0; i < numTreasures; i++) {
                    const x = Math.floor(Math.random() * (room.w-2)) + room.x + 1;
                    const y = Math.floor(Math.random() * (room.h-2)) + room.y + 1;
                    if (!isBlocked(x,y)) {
                       treasures.push({x, y, char: '$', color: COLORS.TREASURE, value: (floor * 10) + 10});
                    }
                }
            }
            
            function isBlocked(x, y) {
                if (map[y][x] === TILE_TYPES.WALL) return true;
                if (player.x === x && player.y === y) return true;
                if (monsters.some(m => m.x === x && m.y === y)) return true;
                return false;
            }

            // --- LÓGICA DEL JUEGO ---
            function initGame() {
                player = new Player(0, 0);
                floor = 1;
                messages = [];
                addMessage("Welcome to the Dungeon!", "#3498db");
                addMessage("Use Arrow Keys to move.", "#ecf0f1");
                nextLevel();
                gameState = 'PLAYING';
            }

            function nextLevel() {
                floor++;
                player.hp = Math.min(player.maxHp, player.hp + Math.floor(player.maxHp / 4)); // Heal a bit
                createDungeon();
                addMessage(`You descend to floor ${floor}.`, '#f1c40f');
            }

            function addMessage(text, color = '#ecf0f1') {
                messages.unshift({text, color});
                if (messages.length > 5) messages.pop();
            }
            
            function movePlayer(dx, dy) {
                const newX = player.x + dx;
                const newY = player.y + dy;

                if (newX < 0 || newX >= MAP_COLS || newY < 0 || newY >= MAP_ROWS || map[newY][newX] === TILE_TYPES.WALL) {
                    return;
                }
                
                const targetMonster = monsters.find(m => m.x === newX && m.y === newY);
                if (targetMonster) {
                    combat(player, targetMonster);
                } else {
                    player.x = newX;
                    player.y = newY;
                    
                    const treasureIndex = treasures.findIndex(t => t.x === newX && t.y === newY);
                    if(treasureIndex !== -1) {
                        const treasure = treasures[treasureIndex];
                        player.score += treasure.value;
                        addMessage(`You found ${treasure.value} gold!`, COLORS.TREASURE);
                        treasures.splice(treasureIndex, 1);
                    }

                    if (player.x === stairs.x && player.y === stairs.y) {
                        nextLevel();
                        return; // Skip monster turn since level changed
                    }
                }
                
                updateMonsters();
                if(player.hp <= 0) {
                    gameState = 'GAME_OVER';
                    addMessage("You died.", "#c0392b");
                }
            }

            function combat(attacker, defender) {
                const damage = attacker.attack;
                defender.hp -= damage;
                addMessage(`${attacker.name} attacks ${defender.name} for ${damage} damage.`, attacker === player ? '#e67e22' : '#c0392b');

                if (defender.hp <= 0) {
                    addMessage(`${defender.name} is dead.`, defender.color);
                    if (defender !== player) {
                        player.score += 25 * floor;
                        monsters = monsters.filter(m => m !== defender);
                    }
                }
            }
            
            function updateMonsters() {
                for (const monster of monsters) {
                    const dx = player.x - monster.x;
                    const dy = player.y - monster.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < 8) { // Chase player
                        const moveX = Math.sign(dx);
                        const moveY = Math.sign(dy);

                        let nextX = monster.x, nextY = monster.y;
                        if (Math.abs(dx) > Math.abs(dy)) {
                            nextX += moveX;
                        } else {
                            nextY += moveY;
                        }

                        if (nextX === player.x && nextY === player.y) {
                            combat(monster, player);
                        } else if (!isBlocked(nextX, nextY)) {
                            monster.x = nextX;
                            monster.y = nextY;
                        }
                    }
                }
            }

            // --- RENDERIZADO ---
            function draw() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                 if (gameState === 'START') {
                    drawStartScreen();
                } else if (gameState === 'PLAYING') {
                    drawGame();
                } else if (gameState === 'GAME_OVER') {
                    drawGameOverScreen();
                }
                requestAnimationFrame(draw);
            }
            
            function drawStartScreen() {
                ctx.fillStyle = '#000';
                ctx.fillRect(0,0,canvas.width, canvas.height);
                ctx.textAlign = 'center';
                ctx.fillStyle = COLORS.TEXT;
                ctx.font = `bold ${FONT_SIZE*2}px 'Consolas', 'Courier New', monospace`;
                ctx.fillText("Dungeon Crawler", canvas.width / 2, canvas.height / 2 - 40);
                
                ctx.font = `${FONT_SIZE}px 'Consolas', 'Courier New', monospace`;
                ctx.fillStyle = '#aaa';
                ctx.fillText("Press [Enter] to start", canvas.width / 2, canvas.height / 2 + 20);
            }

             function drawGameOverScreen() {
                ctx.fillStyle = 'rgba(0,0,0,0.7)';
                ctx.fillRect(0,0,canvas.width, canvas.height);
                ctx.textAlign = 'center';
                ctx.fillStyle = '#c0392b';
                ctx.font = `bold ${FONT_SIZE*2}px 'Consolas', 'Courier New', monospace`;
                ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 60);

                ctx.fillStyle = COLORS.TEXT;
                ctx.font = `${FONT_SIZE*1.2}px 'Consolas', 'Courier New', monospace`;
                ctx.fillText(`You reached floor ${floor}`, canvas.width / 2, canvas.height / 2 - 20);
                ctx.fillText(`Final Score: ${player.score}`, canvas.width / 2, canvas.height / 2 + 10);
                
                ctx.fillStyle = '#aaa';
                ctx.font = `${FONT_SIZE}px 'Consolas', 'Courier New', monospace`;
                ctx.fillText("Press [Enter] to try again", canvas.width / 2, canvas.height / 2 + 60);
            }

            function drawGame() {
                drawMap();
                drawEntities();
                drawUI();
            }

            function drawMap() {
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                for (let y = 0; y < MAP_ROWS; y++) {
                    for (let x = 0; x < MAP_COLS; x++) {
                        if (map[y][x] === TILE_TYPES.WALL) {
                            ctx.fillStyle = COLORS.WALL;
                            ctx.fillText('#', x * TILE_SIZE + TILE_SIZE / 2, y * TILE_SIZE + TILE_SIZE / 2);
                        } else {
                            ctx.fillStyle = COLORS.FLOOR;
                            ctx.fillRect(x*TILE_SIZE, y*TILE_SIZE, TILE_SIZE, TILE_SIZE);
                        }
                    }
                }
            }

            function drawEntities() {
                for (const treasure of treasures) {
                    ctx.fillStyle = treasure.color;
                    ctx.fillText(treasure.char, treasure.x * TILE_SIZE + TILE_SIZE / 2, treasure.y * TILE_SIZE + TILE_SIZE / 2);
                }
                
                ctx.fillStyle = COLORS.STAIRS;
                ctx.fillText('>', stairs.x * TILE_SIZE + TILE_SIZE / 2, stairs.y * TILE_SIZE + TILE_SIZE / 2);
                
                player.draw();

                for (const monster of monsters) {
                    monster.draw();
                }
            }
            
            function drawUI() {
                ctx.textAlign = 'left';
                ctx.textBaseline = 'top';
                ctx.font = `bold ${FONT_SIZE*0.8}px 'Consolas', 'Courier New', monospace`;

                // --- HP Bar ---
                const hpBarWidth = 200;
                ctx.fillStyle = COLORS.HP_BAR_BACK;
                ctx.fillRect(10, 10, hpBarWidth, 20);
                const currentHpWidth = (player.hp / player.maxHp) * hpBarWidth;
                ctx.fillStyle = COLORS.HP_BAR;
                ctx.fillRect(10, 10, Math.max(0, currentHpWidth), 20);
                
                ctx.fillStyle = COLORS.TEXT;
                ctx.fillText(`HP: ${player.hp}/${player.maxHp}`, 15, 12);

                // --- Score & Floor ---
                ctx.textAlign = 'right';
                ctx.fillText(`Score: ${player.score}`, canvas.width - 10, 10);
                ctx.fillText(`Floor: ${floor}`, canvas.width - 10, 30);
                
                // --- Messages ---
                ctx.textAlign = 'left';
                for (let i = 0; i < messages.length; i++) {
                    ctx.fillStyle = messages[i].color;
                    ctx.globalAlpha = 1 - (i*0.2);
                    ctx.fillText(messages[i].text, 10, canvas.height - (i + 1) * 20);
                }
                ctx.globalAlpha = 1.0;
            }

            // --- MANEJO DE ENTRADA ---
            function handleInput(e) {
                if (gameState === 'PLAYING') {
                    e.preventDefault();
                    let dx = 0, dy = 0;
                    switch (e.key) {
                        case 'ArrowUp': dy = -1; break;
                        case 'ArrowDown': dy = 1; break;
                        case 'ArrowLeft': dx = -1; break;
                        case 'ArrowRight': dx = 1; break;
                        default: return;
                    }
                    if (dx !== 0 || dy !== 0) {
                        movePlayer(dx, dy);
                    }
                } else if (gameState === 'START' || gameState === 'GAME_OVER') {
                    if (e.key === 'Enter') {
                        initGame();
                    }
                }
            }

            document.addEventListener('keydown', handleInput);

            // --- INICIO ---
            draw();
        };
    </script>
</body>
</html>
